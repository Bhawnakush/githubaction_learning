name: "lan-03"
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  APP_NAME: "my-devsecops-app"
jobs:
  lint:
    name: "code quality check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "run linter"
        run: | 
          echo "checkint code quality"
          echo " -- no syntax error"
  test:
    name: "run test"
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4
      - name: "run unit test"
        run: |
          echo "running tests "
          echo " test_loging pass"   
  security-scan:
    name: "security-scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "run security test"
        run: |
          echo " scaaning the vuln"
          echo " no vuln found"             
  build:
    name: "build application"
    runs-on: ubuntu-latest
    needs: [lint , test , security-scan]
    steps:
      - uses: actions/checkout@v4
      - name: "build the app"
        run: |
          echo " all check passed"      
  deploy-staging:
    name: "deploy on staging"
    runs-on: ubuntu-latest
    need: build
    steps:
      - name: "deploy to staging"
        run: |
          echo "deployeing to staging "
  deploy-prod:
    name: "deploy to prod"
    runs-on: ubuntu-latest
    need: deploy-staging
    steps:
      - name: "deploy to prod "
        run: |
          echo "deployed toprod"
               
